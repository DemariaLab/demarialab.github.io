<body>
  <main class="publication" id="publication">
    <div class="publication-meta" id="publication-meta">
      <span class="publication-type" id="publication-type">Journal Article</span>
      <span class="journal" id="journal">Oncotarget</span>
      <span class="meta-separator" id="meta-separator" aria-hidden="true">·</span>
      <span class="publication-date" id="publication-date">2015 Jun 30</span>
    </div>

    <h1 class="publication-title" id="publication-title">p53 and rapamycin are additive.</h1>
    <p class="authors" id="authors"><span class="author">Barbara Christy</span>, <span class="author">Marco Demaria</span>, <span class="author">Judith Campisi</span>, <span class="author">Jing Huang</span>, <span class="author">Diane Jones</span>, <span class="author">Sherry G Dodds</span>, <span class="author">Charnae Williams</span>, <span class="author">Gene Hubbard</span>, <span class="author">Carolina B Livi</span>, <span class="author">Xiaoli Gao</span>, <span class="author">Susan Weintraub</span>, <span class="author">Tyler Curiel</span>, <span class="author">Z Dave Sharp</span>, <span class="author">Paul Hasty</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Mechanistic target of rapamycin (mTOR) is a kinase found in a complex (mTORC1) that enables macromolecular synthesis and cell growth and is implicated in cancer etiology. The rapamycin-FK506 binding protein 12 (FKBP12) complex allosterically inhibits mTORC1. In response to stress, p53 inhibits mTORC1 through a separate pathway involving cell signaling and amino acid sensing. Thus, these different mechanisms could be additive. Here we show that p53 improved the ability of rapamycin to: 1) extend mouse life span, 2) suppress ionizing radiation (IR)-induced senescence-associated secretory phenotype (SASP) and 3) increase the levels of amino acids and citric acid in mouse embryonic stem (ES) cells. This additive effect could have implications for cancer treatment since rapamycin and p53 are anti-oncogenic.</p></div>
    </section>
  </main>


