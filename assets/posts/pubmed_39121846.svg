    <h1 class="publication-title" id="publication-title">Guidelines for minimal information on cellular senescence experimentation in vivo.</h1>
    <p class="authors" id="authors"><span class="author">Mikolaj Ogrodnik</span>, <span class="author">Juan Carlos Acosta</span>, <span class="author">Peter D Adams</span>, <span class="author">Fabrizio d'Adda di Fagagna</span>, <span class="author">Darren J Baker</span>, <span class="author">Cleo L Bishop</span>, <span class="author">Tamir Chandra</span>, <span class="author">Manuel Collado</span>, <span class="author">Jesus Gil</span>, <span class="author">Vassilis Gorgoulis</span>, <span class="author">Florian Gruber</span>, <span class="author">Eiji Hara</span>, <span class="author">Pidder Jansen-Dürr</span>, <span class="author">Diana Jurk</span>, <span class="author">Sundeep Khosla</span>, <span class="author">James L Kirkland</span>, <span class="author">Valery Krizhanovsky</span>, <span class="author">Tohru Minamino</span>, <span class="author">Laura J Niedernhofer</span>, <span class="author">João F Passos</span>, <span class="author">Nadja A R Ring</span>, <span class="author">Heinz Redl</span>, <span class="author">Paul D Robbins</span>, <span class="author">Francis Rodier</span>, <span class="author">Karin Scharffetter-Kochanek</span>, <span class="author">John M Sedivy</span>, <span class="author">Ewa Sikora</span>, <span class="author">Kenneth Witwer</span>, <span class="author">Thomas von Zglinicki</span>, <span class="author">Maximina H Yun</span>, <span class="author">Johannes Grillari</span>, <span class="author">Marco Demaria</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Cellular senescence is a cell fate triggered in response to stress and is characterized by stable cell-cycle arrest and a hypersecretory state. It has diverse biological roles, ranging from tissue repair to chronic disease. The development of new tools to study senescence in vivo has paved the way for uncovering its physiological and pathological roles and testing senescent cells as a therapeutic target. However, the lack of specific and broadly applicable markers makes it difficult to identify and characterize senescent cells in tissues and living organisms. To address this, we provide practical guidelines called "minimum information for cellular senescence experimentation in vivo" (MICSE). It presents an overview of senescence markers in rodent tissues, transgenic models, non-mammalian systems, human tissues, and tumors and their use in the identification and specification of senescent cells. These guidelines provide a uniform, state-of-the-art, and accessible toolset to improve our understanding of cellular senescence in vivo.</p></div>
    </section>
