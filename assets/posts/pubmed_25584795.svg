</head>
<body>
  <main class="publication" id="publication">
    <div class="publication-meta" id="publication-meta">
      <span class="publication-type" id="publication-type">Journal Article</span>
      <span class="journal" id="journal">Developmental cell</span>
      <span class="meta-separator" id="meta-separator" aria-hidden="true">·</span>
      <span class="publication-date" id="publication-date">2015 Jan 12</span>
    </div>

    <h1 class="publication-title" id="publication-title">Of flies, mice, and men: evolutionarily conserved tissue damage responses and aging.</h1>
    <p class="authors" id="authors"><span class="author">Joana Neves</span>, <span class="author">Marco Demaria</span>, <span class="author">Judith Campisi</span>, <span class="author">Heinrich Jasper</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Studies in flies, mice, and human models have provided a conceptual framework for how paracrine interactions between damaged cells and the surrounding tissue control tissue repair. These studies have amassed evidence for an evolutionarily conserved secretory program that regulates tissue homeostasis. This program coordinates cell survival and proliferation during tissue regeneration and repair in young animals. By virtue of chronic engagement, however, it also contributes to the age-related decline of tissue homeostasis leading to degeneration, metabolic dysfunction, and cancer. Here, we review recent studies that shed light on the nature and regulation of this evolutionarily conserved secretory program.</p></div>
    </section>
  </main>


</body></html>
  </foreignObject>
</svg>
