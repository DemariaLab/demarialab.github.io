<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1100" viewBox="0 0 960 1100">
  <rect width="100%" height="100%" fill="white"/>
  <foreignObject x="0" y="0" width="960" height="1100">
    <html xmlns="http://www.w3.org/1999/xhtml" lang="en"><head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Of flies, mice, and men: evolutionarily conserved tissue damage responses and aging.</title>
  <style>
    :root {
      color-scheme: light;
      --text: #171a1f;
      --muted: #52606d;
      --accent: #145da0;
      --badge-background: #e7edf4;
      --rule: #d9e0e7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
      color: var(--text);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .publication {
      width: min(100%, 860px);
      margin: 0 auto;
      padding: 42px 58px 68px;
    }

    .publication-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      min-height: 28px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.35;
    }

    .publication-type {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 14px;
      background: var(--badge-background);
      color: #344454;
      font-size: 15px;
      line-height: 1.25;
      border-radius: 2px;
    }

    .journal {
      color: var(--accent);
      font-weight: 700;
    }

    .meta-separator {
