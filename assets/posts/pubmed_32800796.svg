<body>
  <main class="publication" id="publication">
    <div class="publication-meta" id="publication-meta">
      <span class="publication-type" id="publication-type">Journal Article</span>
      <span class="journal" id="journal">Mechanisms of ageing and development</span>
      <span class="meta-separator" id="meta-separator" aria-hidden="true">·</span>
      <span class="publication-date" id="publication-date">2020 Oct</span>
    </div>

    <h1 class="publication-title" id="publication-title">Prolonged hypoxia delays aging and preserves functionality of human amniotic fluid stem cells.</h1>
    <p class="authors" id="authors"><span class="author">Francesca Casciaro</span>, <span class="author">Michela Borghesan</span>, <span class="author">Francesca Beretti</span>, <span class="author">Manuela Zavatti</span>, <span class="author">Emma Bertucci</span>, <span class="author">Matilde Yung Follo</span>, <span class="author">Tullia Maraldi</span>, <span class="author">Marco Demaria</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Human amniotic fluid stem cells (hAFSCs) are an emerging tool in regenerative medicine because they have the ability to differentiate into various lineages and efficiently improve tissue regeneration with no risk of tumorigenesis. Although hAFSCs are easily isolated from the amniotic fluid, their expansion ex vivo is limited by a quick exhaustion which impairs replicative potential and differentiation capacity. In this study, we evaluate various aging features of hAFSCs cultured at different oxygen concentrations. We show that low oxygen (1% O2) extends stemness and proliferative features, and delays induction of senescence-associated markers. Hypoxic hAFSCs activate a metabolic shift and increase resistance to pro-apoptotic stimuli. Moreover, we observe that cells at low oxygen remain capable of osteogenesis for prolonged periods of time, suggesting a more youthful phenotype. Together, these data demonstrate that low oxygen concentrations might improve the generation of functional hAFSCs for therapeutic use by delaying the onset of cellular aging.</p></div>
    </section>
  </main>


