    <h1 class="publication-title" id="publication-title">SILAC Analysis Reveals Increased Secretion of Hemostasis-Related Factors by Senescent Cells.</h1>
    <p class="authors" id="authors"><span class="author">Christopher D Wiley</span>, <span class="author">Su Liu</span>, <span class="author">Chandani Limbad</span>, <span class="author">Anna M Zawadzka</span>, <span class="author">Jennifer Beck</span>, <span class="author">Marco Demaria</span>, <span class="author">Robert Artwood</span>, <span class="author">Fatouma Alimirah</span>, <span class="author">Jose-Alberto Lopez-Dominguez</span>, <span class="author">Chisaka Kuehnemann</span>, <span class="author">Steven R Danielson</span>, <span class="author">Natan Basisty</span>, <span class="author">Herbert G Kasler</span>, <span class="author">Tal Ronnen Oron</span>, <span class="author">Pierre-Yves Desprez</span>, <span class="author">Sean D Mooney</span>, <span class="author">Bradford W Gibson</span>, <span class="author">Birgit Schilling</span>, <span class="author">Judith Campisi</span>, <span class="author">Pankaj Kapahi</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Cellular senescence irreversibly arrests cell proliferation, accompanied by a multi-component senescence-associated secretory phenotype (SASP) that participates in several age-related diseases. Using stable isotope labeling with amino acids (SILACs) and cultured cells, we identify 343 SASP proteins that senescent human fibroblasts secrete at 2-fold or higher levels compared with quiescent cell counterparts. Bioinformatic analysis reveals that 44 of these proteins participate in hemostasis, a process not previously linked with cellular senescence. We validated the expression of some of these SASP factors in cultured cells and in vivo. Mice treated with the chemotherapeutic agent doxorubicin, which induces widespread cellular senescence in vivo, show increased blood clotting. Conversely, selective removal of senescent cells using transgenic p16-3MR mice showed that clearing senescent cells attenuates the increased clotting caused by doxorubicin. Our study provides an in-depth, unbiased analysis of the SASP and unveils a function for cellular senescence in hemostasis.</p></div>
    </section>
