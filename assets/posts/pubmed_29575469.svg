    <h1 class="publication-title" id="publication-title">The effects of graded caloric restriction: XII. Comparison of mouse to human impact on cellular senescence in the colon.</h1>
    <p class="authors" id="authors"><span class="author">Luigi Fontana</span>, <span class="author">Sharon E Mitchell</span>, <span class="author">Boshi Wang</span>, <span class="author">Valeria Tosti</span>, <span class="author">Thijmen van Vliet</span>, <span class="author">Nicola Veronese</span>, <span class="author">Beatrice Bertozzi</span>, <span class="author">Dayna S Early</span>, <span class="author">Parcival Maissan</span>, <span class="author">John R Speakman</span>, <span class="author">Marco Demaria</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Calorie restriction (CR) is an effective strategy to delay the onset and progression of aging phenotypes in a variety of organisms. Several molecular players are involved in the anti-aging effects of CR, but mechanisms of regulation are poorly understood. Cellular senescence-a cellular state of irreversible growth arrest-is considered a basic mechanism of aging. Senescent cells accumulate with age and promote a number of age-related pathologies. Whether environmental conditions such as diet affect the accumulation of cellular senescence with age is still unclear. Here, we show that a number of classical transcriptomic markers of senescent cells are reduced in adult but relatively young mice under CR. Moreover, we demonstrate that such senescence markers are not induced in the colon of middle-age human volunteers under CR in comparison with age-matched volunteers consuming normal Western diets. Our data support the idea that the improvement in health span observed in different organisms under CR might be partly due to a reduction in the number of senescent cells.</p></div>
    </section>
