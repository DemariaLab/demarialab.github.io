    <h1 class="publication-title" id="publication-title">Converting cell death into senescence by PARP1 inhibition improves recovery from acute oxidative injury.</h1>
    <p class="authors" id="authors"><span class="author">Jamil Nehme</span>, <span class="author">Lina Mesilmany</span>, <span class="author">Marta Varela-Eirin</span>, <span class="author">Simone Brandenburg</span>, <span class="author">Abdullah Altulea</span>, <span class="author">Yao Lin</span>, <span class="author">Mariana Gaya da Costa</span>, <span class="author">Marc Seelen</span>, <span class="author">Jan-Luuk Hillebrands</span>, <span class="author">Harry van Goor</span>, <span class="author">Raya Saab</span>, <span class="author">Haidar Akl</span>, <span class="author">Natacha Prevarskaya</span>, <span class="author">Valerio Farfariello</span>, <span class="author">Marco Demaria</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Excessive amounts of reactive oxygen species (ROS) lead to macromolecular damage and high levels of cell death with consequent pathological sequelae. We hypothesized that switching cell death to a tissue regenerative state could potentially improve the short-term and long-term detrimental effects of ROS-associated acute tissue injury, although the mechanisms regulating oxidative stress-induced cell fate decisions and their manipulation for improving repair are poorly understood. Here, we show that cells exposed to high oxidative stress enter a poly (ADP-ribose) polymerase 1 (PARP1)-mediated regulated cell death, and that blocking PARP1 activation promotes conversion of cell death into senescence (CODIS). We demonstrate that this conversion depends on reducing mitochondrial Ca2+ overload as a consequence of retaining the hexokinase II on mitochondria. In a mouse model of kidney ischemia-reperfusion damage, PARP inhibition reduces necrosis and increases transient senescence at the injury site, alongside improved recovery from damage. Together, these data provide evidence that converting cell death into transient senescence can therapeutically benefit tissue regeneration.</p></div>
    </section>
  </main>


