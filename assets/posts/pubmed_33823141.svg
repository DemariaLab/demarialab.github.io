    <h1 class="publication-title" id="publication-title">Physiological hypoxia restrains the senescence-associated secretory phenotype via AMPK-mediated mTOR suppression.</h1>
    <p class="authors" id="authors"><span class="author">Thijmen van Vliet</span>, <span class="author">Marta Varela-Eirin</span>, <span class="author">Boshi Wang</span>, <span class="author">Michela Borghesan</span>, <span class="author">Simone M Brandenburg</span>, <span class="author">Rossana Franzin</span>, <span class="author">Konstantinos Evangelou</span>, <span class="author">Marc Seelen</span>, <span class="author">Vassilis Gorgoulis</span>, <span class="author">Marco Demaria</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Cellular senescence is a state of stable proliferative arrest triggered by damaging signals. Senescent cells persist during aging and promote age-related pathologies via the pro-inflammatory senescence-associated secretory phenotype (SASP), whose regulation depends on environmental factors. In vivo, a major environmental variable is oxygenation, which varies among and within tissues. Here, we demonstrate that senescent cells express lower levels of detrimental pro-inflammatory SASP factors in physiologically hypoxic environments, as measured in culture and in tissues. Mechanistically, exposure of senescent cells to low-oxygen conditions leads to AMPK activation and AMPK-mediated suppression of the mTOR-NF-κB signaling loop. Finally, we demonstrate that treatment with hypoxia-mimetic compounds reduces SASP in cells and tissues and improves strength in chemotherapy-treated and aged mice. Our findings highlight the importance of oxygen as a determinant for pro-inflammatory SASP expression and offer a potential new strategy to reduce detrimental paracrine effects of senescent cells.</p></div>
    </section>
  </main>


