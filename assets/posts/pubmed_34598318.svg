</head>
<body>
  <main class="publication" id="publication">
    <div class="publication-meta" id="publication-meta">
      <span class="publication-type" id="publication-type">Journal Article</span>
      <span class="journal" id="journal">Aging cell</span>
      <span class="meta-separator" id="meta-separator" aria-hidden="true">·</span>
      <span class="publication-date" id="publication-date">2021 Oct</span>
    </div>

    <h1 class="publication-title" id="publication-title">Identification of distinct and age-dependent p16High microglia subtypes.</h1>
    <p class="authors" id="authors"><span class="author">Nynke Talma</span>, <span class="author">Emma Gerrits</span>, <span class="author">Boshi Wang</span>, <span class="author">Bart J L Eggen</span>, <span class="author">Marco Demaria</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Cells expressing high levels of the cyclin-dependent kinase (CDK)4/6 inhibitor p16 (p16High ) accumulate in aging tissues and promote multiple age-related pathologies, including neurodegeneration. Here, we show that the number of p16High cells is significantly increased in the central nervous system (CNS) of 2-year-old mice. Bulk RNAseq indicated that genes expressed by p16High cells were associated with inflammation and phagocytosis. Single-cell RNAseq of brain cells indicated p16High cells were primarily microglia, and their accumulation was confirmed in brains of aged humans. Interestingly, we identified two distinct subpopulations of p16High microglia in the mouse brain, with one being age-associated and one present in young animals. Both p16High clusters significantly differed from previously described disease-associated microglia and expressed only a partial senescence signature. Taken together, our study provides evidence for the existence of two p16-expressing microglia populations, one accumulating with age and another already present in youth that could positively and negatively contribute to brain homeostasis, function, and disease.</p></div>
    </section>
  </main>


