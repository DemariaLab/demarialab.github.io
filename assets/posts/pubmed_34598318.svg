    .publication-title {
      margin: 54px 0 22px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 42px;
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.025em;
    }

    .authors {
      margin: 0;
      color: var(--accent);
      font-size: 18px;
      line-height: 1.55;
    }

    .abstract {
      margin-top: 48px;
      padding-top: 30px;
      border-top: 1px solid var(--rule);
    }

    .abstract-title {
      margin: 0 0 24px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 31px;
      line-height: 1.15;
    }

    .abstract-content {
      font-size: 18px;
      line-height: 1.58;
    }

