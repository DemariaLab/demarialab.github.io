</head>
<body>
  <main class="publication" id="publication">
    <div class="publication-meta" id="publication-meta">
      <span class="publication-type" id="publication-type">Journal Article</span>
      <span class="journal" id="journal">Biochimica et biophysica acta</span>
      <span class="meta-separator" id="meta-separator" aria-hidden="true">·</span>
      <span class="publication-date" id="publication-date">2016 Apr</span>
    </div>

    <h1 class="publication-title" id="publication-title">Cellular senescence and tumor promotion: Is aging the key?</h1>
    <p class="authors" id="authors"><span class="author">Natalia Loaiza</span>, <span class="author">Marco Demaria</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>The senescence response is a potent tumor suppressor mechanism characterized by an irreversible growth arrest in response to potentially oncogenic signals to prevent the proliferation of damaged cells. Late in life, some of the features of senescent cells seem to mediate the development of age-related pathologies, including cancer. In the present review, we present a summary of the current knowledge regarding the causes, effector pathways and cellular features of senescence. We also discuss how the senescence response, initially a tumor suppressor mechanism, turns into a tumor promoter apparently as a consequence of aging. We argue that three age-related phenomena--senescence-associated secretory phenotype (SASP) dysregulation, decline in the immune system function and genomic instability--could contribute, independently or synergistically, to deteriorate the efficacy of the senescence response in stopping cancer. As a consequence, senescent cells could be considered premalignant cells, and targeting senescent cells could be a preventive and therapeutic strategy against cancer.</p></div>
    </section>
  </main>


