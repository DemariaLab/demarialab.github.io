<body>
  <main class="publication" id="publication">
    <div class="publication-meta" id="publication-meta">
      <span class="publication-type" id="publication-type">Journal Article</span>
      <span class="journal" id="journal">Ageing research reviews</span>
      <span class="meta-separator" id="meta-separator" aria-hidden="true">·</span>
      <span class="publication-date" id="publication-date">2024 Jan</span>
    </div>

    <h1 class="publication-title" id="publication-title">Cellular senescence in brain aging and neurodegeneration.</h1>
    <p class="authors" id="authors"><span class="author">L S Melo Dos Santos</span>, <span class="author">M Trombetta-Lima</span>, <span class="author">Bjl Eggen</span>, <span class="author">M Demaria</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Cellular senescence is a state of terminal cell cycle arrest associated with various macromolecular changes and a hypersecretory phenotype. In the brain, senescent cells naturally accumulate during aging and at sites of age-related pathologies. Here, we discuss the recent advances in understanding the accumulation of senescent cells in brain aging and disorders. Here we highlight the phenotypical heterogeneity of different senescent brain cell types, highlighting the potential importance of subtype-specific features for physiology and pathology. We provide a comprehensive overview of various senescent cell types in naturally occurring aging and the most common neurodegenerative disorders. Finally, we critically discuss the potential of adapting senotherapeutics to improve brain health and reduce pathological progression, addressing limitations and future directions for application and development.</p></div>
    </section>
  </main>


