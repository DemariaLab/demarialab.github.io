 <span class="author">Heidi H Pak</span>, <span class="author">Andrey Parkhitko</span>, <span class="author">Nuno Raimundo</span>, <span class="author">Thomas A Rando</span>, <span class="author">Lene Juel Rasmussen</span>, <span class="author">Carolina Reis</span>, <span class="author">Christian G Riedel</span>, <span class="author">Anais Franco-Romero</span>, <span class="author">Björn Schumacher</span>, <span class="author">David A Sinclair</span>, <span class="author">Yousin Suh</span>, <span class="author">Pam R Taub</span>, <span class="author">Debra Toiber</span>, <span class="author">Jonas T Treebak</span>, <span class="author">Dario Riccardo Valenzano</span>, <span class="author">Eric Verdin</span>, <span class="author">Jan Vijg</span>, <span class="author">Sergey Young</span>, <span class="author">Lei Zhang</span>, <span class="author">Daniela Bakula</span>, <span class="author">Alex Zhavoronkov</span>, <span class="author">Morten Scheibye-Knudsen</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Aging is emerging as a druggable target with growing interest from academia, industry and investors. New technologies such as artificial intelligence and advanced screening techniques, as well as a strong influence from the industry sector may lead to novel discoveries to treat age-related diseases. The present review summarizes presentations from the 7th Annual Aging Research and Drug Discovery (ARDD) meeting, held online on the 1st to 4th of September 2020. The meeting covered topics related to new methodologies to study aging, knowledge about basic mechanisms of longevity, latest interventional strategies to target the aging process as well as discussions about the impact of aging research on society and economy. More than 2000 participants and 65 speakers joined the meeting and we already look forward to an even larger meeting next year. Please mark your calendars for the 8th ARDD meeting that is scheduled for the 31st of August to 3rd of September, 2021, at Columbia University, USA.</p></div>
    </section>
