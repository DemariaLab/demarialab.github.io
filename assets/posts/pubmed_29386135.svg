    <h1 class="publication-title" id="publication-title">Cellular Senescence Is Induced by the Environmental Neurotoxin Paraquat and Contributes to Neuropathology Linked to Parkinson's Disease.</h1>
    <p class="authors" id="authors"><span class="author">Shankar J Chinta</span>, <span class="author">Georgia Woods</span>, <span class="author">Marco Demaria</span>, <span class="author">Anand Rane</span>, <span class="author">Ying Zou</span>, <span class="author">Amanda McQuade</span>, <span class="author">Subramanian Rajagopalan</span>, <span class="author">Chandani Limbad</span>, <span class="author">David T Madden</span>, <span class="author">Judith Campisi</span>, <span class="author">Julie K Andersen</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Exposure to the herbicide paraquat (PQ) is associated with an increased risk of idiopathic Parkinson's disease (PD). Therapies based on PQ's presumed mechanisms of action have not, however, yielded effective disease therapies. Cellular senescence is an anticancer mechanism that arrests proliferation of replication-competent cells and results in a pro-inflammatory senescence-associated secretory phenotype (SASP) capable of damaging neighboring tissues. Here, we demonstrate that senescent cell markers are preferentially present within astrocytes in PD brain tissues. Additionally, PQ was found to induce astrocytic senescence and an SASP in vitro and in vivo, and senescent cell depletion in the latter protects against PQ-induced neuropathology. Our data suggest that exposure to certain environmental toxins promotes accumulation of senescent cells in the aging brain, which can contribute to dopaminergic neurodegeneration. Therapies that target senescent cells may constitute a strategy for treatment of sporadic PD, for which environmental exposure is a major risk factor.</p></div>
    </section>
