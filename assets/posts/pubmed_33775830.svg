    <html xmlns="http://www.w3.org/1999/xhtml" lang="en"><head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biological functions of therapy-induced senescence in cancer.</title>
  <style>
    :root {
      color-scheme: light;
      --text: #171a1f;
      --muted: #52606d;
      --accent: #145da0;
      --badge-background: #e7edf4;
      --rule: #d9e0e7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
