      min-height: 100%;
      background: #ffffff;
      color: var(--text);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .publication {
      width: min(100%, 860px);
      margin: 0 auto;
      padding: 42px 58px 68px;
    }

    .publication-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      min-height: 28px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.35;
    }

    .publication-type {
      display: inline-flex;
      align-items: center;
