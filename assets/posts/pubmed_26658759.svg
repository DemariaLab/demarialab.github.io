<body>
  <main class="publication" id="publication">
    <div class="publication-meta" id="publication-meta">
      <span class="publication-type" id="publication-type">Journal Article</span>
      <span class="journal" id="journal">Scientific reports</span>
      <span class="meta-separator" id="meta-separator" aria-hidden="true">·</span>
      <span class="publication-date" id="publication-date">2015 Dec 14</span>
    </div>

    <h1 class="publication-title" id="publication-title">Simvastatin suppresses breast cancer cell proliferation induced by senescent cells.</h1>
    <p class="authors" id="authors"><span class="author">Su Liu</span>, <span class="author">Harpreet Uppal</span>, <span class="author">Marco Demaria</span>, <span class="author">Pierre-Yves Desprez</span>, <span class="author">Judith Campisi</span>, <span class="author">Pankaj Kapahi</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Cellular senescence suppresses cancer by preventing the proliferation of damaged cells, but senescent cells can also promote cancer though the pro-inflammatory senescence-associated secretory phenotype (SASP). Simvastatin, an HMG-coA reductase inhibitor, is known to attenuate inflammation and prevent certain cancers. Here, we show that simvastatin decreases the SASP of senescent human fibroblasts by inhibiting protein prenylation, without affecting the senescent growth arrest. The Rho family GTPases Rac1 and Cdc42 were activated in senescent cells, and simvastatin reduced both activities. Further, geranylgeranyl transferase, Rac1 or Cdc42 depletion reduced IL-6 secretion by senescent cells. We also show that simvastatin mitigates the effects of senescent conditioned media on breast cancer cell proliferation and endocrine resistance. Our findings identify a novel activity of simvastatin and mechanism of SASP regulation. They also suggest that senescent cells, which accumulate after radio/chemo therapy, promote endocrine resistance in breast cancer and that simvastatin might suppress this resistance.</p></div>
    </section>
  </main>


