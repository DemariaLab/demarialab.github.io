  <title>A novel suicide gene therapy for the treatment of p16Ink4a-overexpressing tumors.</title>
  <style>
    :root {
      color-scheme: light;
      --text: #171a1f;
      --muted: #52606d;
      --accent: #145da0;
      --badge-background: #e7edf4;
