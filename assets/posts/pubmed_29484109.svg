<body>
  <main class="publication" id="publication">
    <div class="publication-meta" id="publication-meta">
      <span class="publication-type" id="publication-type">Journal Article</span>
      <span class="journal" id="journal">Oncotarget</span>
      <span class="meta-separator" id="meta-separator" aria-hidden="true">·</span>
      <span class="publication-date" id="publication-date">2018 Jan 26</span>
    </div>

    <h1 class="publication-title" id="publication-title">A novel suicide gene therapy for the treatment of p16Ink4a-overexpressing tumors.</h1>
    <p class="authors" id="authors"><span class="author">Jaskaren Kohli</span>, <span class="author">Judith Campisi</span>, <span class="author">Marco Demaria</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>p16Ink4a is a potent cell cycle inhibitor engaged to support cell cycle arrest during cellular senescence. However, in tumors carrying mutations in key downstream effectors, p16Ink4a is highly expressed but fails to block cell proliferation. p16Ink4a-overexpressing tumor cells are highly aggressive and no targeted interventions are available. To study the effect of specific therapies, we generated murine sarcomas by overexpressing RAS oncogene and disrupting p53 activity. We observed that p16Ink4a-overxpressing murine sarcoma cells were resistant to ABT-263 and ABT-737, anti-cancer small molecules previously shown to eliminate p16Ink4a+ senescent cells. We then generated sarcoma cells carrying a suicide and reporter gene, called 3MR, under the regulation of the full p16Ink4a promoter. Activation of the suicide efficiently killed p16Ink4a-overxpressing sarcoma cells in vitro and in vivo. These data suggest that suicide gene therapy could represent an important therapeutic approach for the treatment of highly aggressive p16Ink4a+ cancers.</p></div>
    </section>
  </main>


