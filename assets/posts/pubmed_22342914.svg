        margin-top: 42px;
        font-size: 35px;
      }
    }
  </style>
</head>
<body>
  <main class="publication" id="publication">
    <div class="publication-meta" id="publication-meta">
      <span class="publication-type" id="publication-type">Journal Article</span>
      <span class="journal" id="journal">Neuroscience letters</span>
      <span class="meta-separator" id="meta-separator" aria-hidden="true">·</span>
      <span class="publication-date" id="publication-date">2012 Apr 18</span>
    </div>

    <h1 class="publication-title" id="publication-title">Hypoxia-inducible factor-1 and neuroglobin expression.</h1>
    <p class="authors" id="authors"><span class="author">Bryan Haines</span>, <span class="author">Marco Demaria</span>, <span class="author">Xiao Mao</span>, <span class="author">Lin Xie</span>, <span class="author">Judith Campisi</span>, <span class="author">Kunlin Jin</span>, <span class="author">David A Greenberg</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Neuroglobin (Ngb) is a hypoxia-inducible protein with cytoprotective effects in animal models of stroke, Alzheimer's disease, and related disorders, but the molecular mechanisms involved in its induction are unknown. We tested the hypothesis that hypoxia-inducible factor-1 (HIF-1) regulates Ngb levels, using shRNA-mediated knockdown and lentiviral vector-mediated overexpression of the HIF-1α subunit, in cultured neural (HN33) cells. HIF-1α knockdown decreased and HIF-1α overexpression increased Ngb levels, consistent with a connection between HIF-1 and Ngb induction. These findings may have implications for understanding the hypoxia-response repertoire of neural cells and devising therapeutic strategies for neurologic disorders.</p></div>
    </section>
  </main>


</body></html>
  </foreignObject>
</svg>
