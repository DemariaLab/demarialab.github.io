    <h1 class="publication-title" id="publication-title">Cellular senescence and cardiovascular diseases: moving to the "heart" of the problem.</h1>
    <p class="authors" id="authors"><span class="author">Konstantinos Evangelou</span>, <span class="author">Panagiotis V S Vasileiou</span>, <span class="author">Angelos Papaspyropoulos</span>, <span class="author">Orsalia Hazapis</span>, <span class="author">Russell Petty</span>, <span class="author">Marco Demaria</span>, <span class="author">Vassilis G Gorgoulis</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Cardiovascular diseases (CVDs) constitute the prime cause of global mortality, with an immense impact on patient quality of life and disability. Clinical evidence has revealed a strong connection between cellular senescence and worse cardiac outcomes in the majority of CVDs concerning both ischemic and nonischemic cardiomyopathies. Cellular senescence is characterized by cell cycle arrest accompanied by alterations in several metabolic pathways, resulting in morphological and functional changes. Metabolic rewiring of senescent cells results in marked paracrine activity, through a unique secretome, often exerting deleterious effects on neighboring cells. Here, we recapitulate the hallmarks and key molecular pathways involved in cellular senescence in the cardiac context and summarize the different roles of senescence in the majority of CVDs. In the last few years, the possibility of eliminating senescent cells in various pathological conditions has been increasingly explored, giving rise to the field of senotherapeutics. Therefore, we additionally attempt to clarify the current state of this field with a focus on cardiac senescence and discuss the potential of implementing senolytics as a treatment option in heart disease.</p></div>
    </section>
