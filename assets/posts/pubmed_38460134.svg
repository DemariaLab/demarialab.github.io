<body>
  <main class="publication" id="publication">
    <div class="publication-meta" id="publication-meta">
      <span class="publication-type" id="publication-type">Journal Article</span>
      <span class="journal" id="journal">STAR protocols</span>
      <span class="meta-separator" id="meta-separator" aria-hidden="true">·</span>
      <span class="publication-date" id="publication-date">2024 Mar 15</span>
    </div>

    <h1 class="publication-title" id="publication-title">One-step rapid tracking and isolation of senescent cells in cellular systems, tissues, or animal models via GLF16.</h1>
    <p class="authors" id="authors"><span class="author">Sophia Magkouta</span>, <span class="author">Dimitris Veroutis</span>, <span class="author">Athanasios Pousias</span>, <span class="author">Angelos Papaspyropoulos</span>, <span class="author">Kety Giannetti</span>, <span class="author">Natassa Pippa</span>, <span class="author">Nikolaos Lougiakis</span>, <span class="author">Konstantinos Kambas</span>, <span class="author">Nefeli Lagopati</span>, <span class="author">Aikaterini Polyzou</span>, <span class="author">Maria Georgiou</span>, <span class="author">Maria Chountoulesi</span>, <span class="author">Stergios Pispas</span>, <span class="author">Spyros Foutadakis</span>, <span class="author">Efthymios Kyrodimos</span>, <span class="author">Nicole Pouli</span>, <span class="author">Panagiotis Marakos</span>, <span class="author">Athanassios Kotsinas</span>, <span class="author">Panayotis Verginis</span>, <span class="author">Dimitrios Valakos</span>, <span class="author">Giannis Vatsellas</span>, <span class="author">Russell Petty</span>, <span class="author">Dimitris Thanos</span>, <span class="author">Marco Demaria</span>, <span class="author">Konstantinos Evangelou</span>, <span class="author">Raffaella Di Micco</span>, <span class="author">Vassilis G Gorgoulis</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Identification and isolation of senescent cells is challenging, rendering their detailed analysis an unmet need. We describe a precise one-step protocol to fluorescently label senescent cells, for flow cytometry and fluorescence microscopy, implementing a fluorophore-conjugated Sudan Black-B analog, GLF16. Also, a micelle-based approach allows identification of senescent cells in vivo and in vitro, enabling live-cell sorting for downstream analyses and live in vivo tracking. Our protocols are applicable to cellular systems, tissues, or animal models where senescence is present. For complete details on the use and execution of this protocol, please refer to Magkouta et al.1.</p></div>
    </section>
  </main>


