</head>
<body>
  <main class="publication" id="publication">
    <div class="publication-meta" id="publication-meta">
      <span class="publication-type" id="publication-type">Journal Article</span>
      <span class="journal" id="journal">Trends in cancer</span>
      <span class="meta-separator" id="meta-separator" aria-hidden="true">·</span>
      <span class="publication-date" id="publication-date">2020 Oct</span>
    </div>

    <h1 class="publication-title" id="publication-title">Senescent Cells in Cancer Therapy: Friends or Foes?</h1>
    <p class="authors" id="authors"><span class="author">Boshi Wang</span>, <span class="author">Jaskaren Kohli</span>, <span class="author">Marco Demaria</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Several cancer interventions induce DNA damage and promote senescence in cancer and nonmalignant cells. Senescent cells secrete a collection of proinflammatory factors collectively termed the senescence-associated secretory phenotype (SASP). SASP factors are able to potentiate various aspects of tumorigenesis, including proliferation, metastasis, and immunosuppression. Moreover, the accumulation and persistence of therapy-induced senescent cells can promote tissue dysfunction and the early onset of various age-related symptoms in treated cancer patients. Here, we review in detail the mechanisms by which cellular senescence contributes to cancer development and the side effects of cancer therapies. We also review how pharmacological interventions to eliminate senescent cells or inhibit SASP production can mitigate these negative effects and propose therapeutic strategies based on the age of the patient.</p></div>
    </section>
  </main>


</body></html>
  </foreignObject>
