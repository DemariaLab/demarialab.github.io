    <h1 class="publication-title" id="publication-title">Oxylipin biosynthesis reinforces cellular senescence and allows detection of senolysis.</h1>
    <p class="authors" id="authors"><span class="author">Christopher D Wiley</span>, <span class="author">Rishi Sharma</span>, <span class="author">Sonnet S Davis</span>, <span class="author">Jose Alberto Lopez-Dominguez</span>, <span class="author">Kylie P Mitchell</span>, <span class="author">Samantha Wiley</span>, <span class="author">Fatouma Alimirah</span>, <span class="author">Dong Eun Kim</span>, <span class="author">Therese Payne</span>, <span class="author">Andrew Rosko</span>, <span class="author">Eliezer Aimontche</span>, <span class="author">Sharvari M Deshpande</span>, <span class="author">Francesco Neri</span>, <span class="author">Chisaka Kuehnemann</span>, <span class="author">Marco Demaria</span>, <span class="author">Arvind Ramanathan</span>, <span class="author">Judith Campisi</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Cellular senescence is a stress or damage response that causes a permanent proliferative arrest and secretion of numerous factors with potent biological activities. This senescence-associated secretory phenotype (SASP) has been characterized largely for secreted proteins that participate in embryogenesis, wound healing, inflammation, and many age-related pathologies. By contrast, lipid components of the SASP are understudied. We show that senescent cells activate the biosynthesis of several oxylipins that promote segments of the SASP and reinforce the proliferative arrest. Notably, senescent cells synthesize and accumulate an unstudied intracellular prostaglandin, 1a,1b-dihomo-15-deoxy-delta-12,14-prostaglandin J2. Released 15-deoxy-delta-12,14-prostaglandin J2 is a biomarker of senolysis in culture and in vivo. This and other prostaglandin D2-related lipids promote the senescence arrest and SASP by activating RAS signaling. These data identify an important aspect of cellular senescence and a method to detect senolysis.</p></div>
    </section>
  </main>


