<body>
  <main class="publication" id="publication">
    <div class="publication-meta" id="publication-meta">
      <span class="publication-type" id="publication-type">Journal Article</span>
      <span class="journal" id="journal">Interdisciplinary topics in gerontology</span>
      <span class="meta-separator" id="meta-separator" aria-hidden="true">·</span>
      <span class="publication-date" id="publication-date">2013</span>
    </div>

    <h1 class="publication-title" id="publication-title">Senescent cells and their secretory phenotype as targets for cancer therapy.</h1>
    <p class="authors" id="authors"><span class="author">Michael C Velarde</span>, <span class="author">Marco Demaria</span>, <span class="author">Judith Campisi</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Cancer is a devastating disease that increases exponentially with age. Cancer arises from cells that proliferate in an unregulated manner, an attribute that is countered by cellular senescence. Cellular senescence is a potent tumor-suppressive process that halts the proliferation, essentially irreversibly, of cells at risk for malignant transformation. A number of anti-cancer drugs have emerged that induce tumor cells to undergo cellular senescence. However, although a senescence response can halt the proliferation of cancer cells, the presence of senescent cells in tissues has been associated with age-related diseases, including, ironically, late-life cancer. Thus, anti-cancer therapies that can induce senescence might also drive aging phenotypes and age-related pathology. The deleterious effects of senescent cells most likely derive from their senescence-associated secretory phenotype or SASP. The SASP entails the secretion of numerous inflammatory cytokines, growth factors and proteases that can render the tissue microenvironment favorable for tumor growth. Here, we discuss the beneficial and detrimental effects of inducing cellular senescence, and propose strategies for targeting senescent cells as a means to fight cancer.</p></div>
    </section>
  </main>


