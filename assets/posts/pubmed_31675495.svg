    <h1 class="publication-title" id="publication-title">Cellular Senescence: Defining a Path Forward.</h1>
    <p class="authors" id="authors"><span class="author">Vassilis Gorgoulis</span>, <span class="author">Peter D Adams</span>, <span class="author">Andrea Alimonti</span>, <span class="author">Dorothy C Bennett</span>, <span class="author">Oliver Bischof</span>, <span class="author">Cleo Bishop</span>, <span class="author">Judith Campisi</span>, <span class="author">Manuel Collado</span>, <span class="author">Konstantinos Evangelou</span>, <span class="author">Gerardo Ferbeyre</span>, <span class="author">Jesús Gil</span>, <span class="author">Eiji Hara</span>, <span class="author">Valery Krizhanovsky</span>, <span class="author">Diana Jurk</span>, <span class="author">Andrea B Maier</span>, <span class="author">Masashi Narita</span>, <span class="author">Laura Niedernhofer</span>, <span class="author">João F Passos</span>, <span class="author">Paul D Robbins</span>, <span class="author">Clemens A Schmitt</span>, <span class="author">John Sedivy</span>, <span class="author">Konstantinos Vougas</span>, <span class="author">Thomas von Zglinicki</span>, <span class="author">Daohong Zhou</span>, <span class="author">Manuel Serrano</span>, <span class="author">Marco Demaria</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Cellular senescence is a cell state implicated in various physiological processes and a wide spectrum of age-related diseases. Recently, interest in therapeutically targeting senescence to improve healthy aging and age-related disease, otherwise known as senotherapy, has been growing rapidly. Thus, the accurate detection of senescent cells, especially in vivo, is essential. Here, we present a consensus from the International Cell Senescence Association (ICSA), defining and discussing key cellular and molecular features of senescence and offering recommendations on how to use them as biomarkers. We also present a resource tool to facilitate the identification of genes linked with senescence, SeneQuest (available at http://Senequest.net). Lastly, we propose an algorithm to accurately assess and quantify senescence, both in cultured cells and in vivo.</p></div>
    </section>
