<body>
  <main class="publication" id="publication">
    <div class="publication-meta" id="publication-meta">
      <span class="publication-type" id="publication-type">Journal Article</span>
      <span class="journal" id="journal">GeroScience</span>
      <span class="meta-separator" id="meta-separator" aria-hidden="true">·</span>
      <span class="publication-date" id="publication-date">2024 Apr</span>
    </div>

    <h1 class="publication-title" id="publication-title">In-vivo screening implicates endoribonuclease Regnase-1 in modulating senescence-associated lysosomal changes.</h1>
    <p class="authors" id="authors"><span class="author">Richard Venz</span>, <span class="author">Anita Goyala</span>, <span class="author">Abel Soto-Gamez</span>, <span class="author">Tugce Yenice</span>, <span class="author">Marco Demaria</span>, <span class="author">Collin Y Ewald</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Accumulation of senescent cells accelerates aging and age-related diseases, whereas preventing this accumulation extends the lifespan in mice. A characteristic of senescent cells is increased staining with β-galactosidase (β-gal) ex vivo. Here, we describe a progressive accumulation of β-gal staining in the model organism C. elegans during aging. We show that distinct pharmacological and genetic interventions targeting the mitochondria and the mTORC1 to the nuclear core complex axis, the non-canonical apoptotic, and lysosomal-autophagy pathways slow the age-dependent accumulation of β-gal. We identify a novel gene, rege-1/Regnase-1/ZC3H12A/MCPIP1, modulating β-gal staining via the transcription factor ets-4/SPDEF. We demonstrate that knocking down Regnase-1 in human cell culture prevents senescence-associated β-gal accumulation. Our data provide a screening pipeline to identify genes and drugs modulating senescence-associated lysosomal phenotypes.</p></div>
    </section>
  </main>


