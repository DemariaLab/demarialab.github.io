    <html xmlns="http://www.w3.org/1999/xhtml" lang="en"><head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STAT3 and metabolism: how many ways to use a single molecule?</title>
  <style>
    :root {
      color-scheme: light;
      --text: #171a1f;
      --muted: #52606d;
      --accent: #145da0;
      --badge-background: #e7edf4;
      --rule: #d9e0e7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
      color: var(--text);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .publication {
      width: min(100%, 860px);
      margin: 0 auto;
      padding: 42px 58px 68px;
    }

    .publication-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      min-height: 28px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.35;
    }

    .publication-type {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 14px;
