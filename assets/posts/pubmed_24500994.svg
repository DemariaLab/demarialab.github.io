</head>
<body>
  <main class="publication" id="publication">
    <div class="publication-meta" id="publication-meta">
      <span class="publication-type" id="publication-type">Journal Article</span>
      <span class="journal" id="journal">International journal of cancer</span>
      <span class="meta-separator" id="meta-separator" aria-hidden="true">·</span>
      <span class="publication-date" id="publication-date">2014 Nov 01</span>
    </div>

    <h1 class="publication-title" id="publication-title">STAT3 and metabolism: how many ways to use a single molecule?</h1>
    <p class="authors" id="authors"><span class="author">Marco Demaria</span>, <span class="author">Annalisa Camporeale</span>, <span class="author">Valeria Poli</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>The transcription factor Signal Transducer and Activator of Transcription (STAT)3 has been considered as a potential anticancer target since its first description as an oncogene in 1999, recently leading to STAT3 inhibitors been brought to clinical trial for the treatment of solid tumors. However, the past 14 years of intense basic research have uncovered novel STAT3-mediated pathways that could affect the outcome of the designed therapies while at the same time help designing function-specific inhibitors. Particularly intriguing are the recent findings that suggest profound implications of STAT3 with the regulation of cellular metabolism in both canonical, that is transcriptional, and non-canonical ways. Here, after a short description of the main known features of STAT3 signaling and function, we review the recent literature on the role of STAT3 in regulating cellular metabolism and discuss the potential consequences on the therapeutic approaches currently under clinical experimentation.</p></div>
    </section>
  </main>


</body></html>
