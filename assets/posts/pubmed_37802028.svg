    <h1 class="publication-title" id="publication-title">A fluorophore-conjugated reagent enabling rapid detection, isolation and live tracking of senescent cells.</h1>
    <p class="authors" id="authors"><span class="author">Sophia Magkouta</span>, <span class="author">Dimitris Veroutis</span>, <span class="author">Athanasios Pousias</span>, <span class="author">Angelos Papaspyropoulos</span>, <span class="author">Natassa Pippa</span>, <span class="author">Nikolaos Lougiakis</span>, <span class="author">Konstantinos Kambas</span>, <span class="author">Nefeli Lagopati</span>, <span class="author">Aikaterini Polyzou</span>, <span class="author">Maria Georgiou</span>, <span class="author">Maria Chountoulesi</span>, <span class="author">Stergios Pispas</span>, <span class="author">Spyros Foutadakis</span>, <span class="author">Nicole Pouli</span>, <span class="author">Panagiotis Marakos</span>, <span class="author">Athanassios Kotsinas</span>, <span class="author">Panayotis Verginis</span>, <span class="author">Dimitrios Valakos</span>, <span class="author">Athanasia Mizi</span>, <span class="author">Argyris Papantonis</span>, <span class="author">Giannis Vatsellas</span>, <span class="author">Panagiotis Galanos</span>, <span class="author">Jiri Bartek</span>, <span class="author">Russell Petty</span>, <span class="author">Manuel Serrano</span>, <span class="author">Dimitris Thanos</span>, <span class="author">Charis Roussos</span>, <span class="author">Marco Demaria</span>, <span class="author">Konstantinos Evangelou</span>, <span class="author">Vassilis G Gorgoulis</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Cellular senescence is a stress-response mechanism implicated in various physiological processes, diseases, and aging. Current detection approaches have partially addressed the issue of senescent cell identification in clinical specimens. Effective methodologies enabling precise isolation or live tracking of senescent cells are still lacking. In-depth analysis of truly senescent cells is, therefore, an extremely challenging task. We report (1) the synthesis and validation of a fluorophore-conjugated, Sudan Black-B analog (GLF16), suitable for in vivo and in vitro analysis of senescence by fluorescence microscopy and flow cytometry and (2) the development and application of a GLF16-carrying micelle vector facilitating GLF16 uptake by living senescent cells in vivo and in vitro. The compound and the applied methodology render isolation of senescent cells an easy, rapid, and precise process. Straightforward nanocarrier-mediated GLF16 delivery in live senescent cells comprises a unique tool for characterization of senescence at an unprecedented depth.</p></div>
    </section>
  </main>


