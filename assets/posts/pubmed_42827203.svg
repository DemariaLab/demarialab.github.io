<body>
  <main class="publication" id="publication">
    <div class="publication-meta" id="publication-meta">
      <span class="publication-type" id="publication-type">Journal Article</span>
      <span class="journal" id="journal">The EMBO journal</span>
      <span class="meta-separator" id="meta-separator" aria-hidden="true">·</span>
      <span class="publication-date" id="publication-date">2026 Oct 02</span>
    </div>

    <h1 class="publication-title" id="publication-title">Cellular senescence: six decades of discovery and reinvention.</h1>
    <p class="authors" id="authors"><span class="author">Myrthe Klaver</span>, <span class="author">Lotte Sophie Steeneken</span>, <span class="author">Naomi Veeningen</span>, <span class="author">Abdullah Altulea</span>, <span class="author">Marco Demaria</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Cellular senescence has undergone a remarkable conceptual evolution since its discovery in 1961. Initially described by Hayflick and Moorhead as the finite proliferative lifespan of cultured human cells, senescence was first viewed as a consequence of cellular aging. The identification of telomere shortening, senescence biomarkers, and oncogene- and damage-induced senescence subsequently established its molecular basis and role as a tumor-suppressive stress response. The discovery of the senescence-associated secretory phenotype (SASP) further transformed the field by revealing that senescent cells actively communicate with and remodel their tissue environment. Genetic mouse models later demonstrated causal roles for senescent cells in tissue repair, aging, and age-related disease, while senotherapeutics established senescence as a therapeutic target. Here, we trace the major conceptual transitions that shaped the field, from replicative endpoint to stress-response program, regulator of tissue homeostasis, driver of chronic pathology, and clinically actionable process. We discuss the discoveries, controversies, and technological advances underlying these transitions and how emerging single-cell technologies, precision biomarkers, and targeted interventions are shaping the next era of senescence research.</p></div>
    </section>
  </main>


