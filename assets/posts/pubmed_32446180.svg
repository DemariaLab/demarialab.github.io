    <h1 class="publication-title" id="publication-title">Early ageing after cytotoxic treatment for testicular cancer and cellular senescence: Time to act.</h1>
    <p class="authors" id="authors"><span class="author">Sjoukje Lubberts</span>, <span class="author">Coby Meijer</span>, <span class="author">Marco Demaria</span>, <span class="author">Jourik A Gietema</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Treatment of testicular cancer (TC) has an exceptionally high success rate compared to other cancer types; even in case of metastasized disease, 80-90 % of TC patients can be cured. Consequently, attention has been drawn to a potential downside of this treatment success: late adverse treatment effects such as the accelerated development of otherwise age-associated features like cardiovascular disease and second malignancies. Underlying mechanisms are poorly understood. Emerging data suggest that cytotoxic treatment induces cellular senescence, resulting in secretion of inflammatory factors contributing to this early ageing phenotype. Molecular and cellular characterization of this early ageing will enhance understanding the pathogenesis of TC treatment-induced morbidity and contribute to better recognition and prevention of late effects. In this review, we describe clinical manifestations of the early ageing phenotype among TC survivors, and subsequently focus on potential underlying mechanisms. We discuss the clinical implications and describe perspectives for future research and intervention strategies.</p></div>
    </section>
  </main>


