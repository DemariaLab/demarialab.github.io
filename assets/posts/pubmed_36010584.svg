<body>
  <main class="publication" id="publication">
    <div class="publication-meta" id="publication-meta">
      <span class="publication-type" id="publication-type">Journal Article</span>
      <span class="journal" id="journal">Cells</span>
      <span class="meta-separator" id="meta-separator" aria-hidden="true">·</span>
      <span class="publication-date" id="publication-date">2022 Aug 12</span>
    </div>

    <h1 class="publication-title" id="publication-title">Simple Detection of Unstained Live Senescent Cells with Imaging Flow Cytometry.</h1>
    <p class="authors" id="authors"><span class="author">Marco Malavolta</span>, <span class="author">Robertina Giacconi</span>, <span class="author">Francesco Piacenza</span>, <span class="author">Sergio Strizzi</span>, <span class="author">Maurizio Cardelli</span>, <span class="author">Giorgia Bigossi</span>, <span class="author">Serena Marcozzi</span>, <span class="author">Luca Tiano</span>, <span class="author">Fabio Marcheggiani</span>, <span class="author">Giulia Matacchione</span>, <span class="author">Angelica Giuliani</span>, <span class="author">Fabiola Olivieri</span>, <span class="author">Ilaria Crivellari</span>, <span class="author">Antonio Paolo Beltrami</span>, <span class="author">Alessandro Serra</span>, <span class="author">Marco Demaria</span>, <span class="author">Mauro Provinciali</span></p>

    <section class="abstract" id="abstract-section">
      <h2 class="abstract-title">Abstract</h2>
      <div class="abstract-content" id="abstract-content"><p>Cellular senescence is a hallmark of aging and a promising target for therapeutic approaches. The identification of senescent cells requires multiple biomarkers and complex experimental procedures, resulting in increased variability and reduced sensitivity. Here, we propose a simple and broadly applicable imaging flow cytometry (IFC) method. This method is based on measuring autofluorescence and morphological parameters and on applying recent artificial intelligence (AI) and machine learning (ML) tools. We show that the results of this method are superior to those obtained measuring the classical senescence marker, senescence-associated beta-galactosidase (SA-β-Gal). We provide evidence that this method has the potential for diagnostic or prognostic applications as it was able to detect senescence in cardiac pericytes isolated from the hearts of patients affected by end-stage heart failure. We additionally demonstrate that it can be used to quantify senescence "in vivo" and can be used to evaluate the effects of senolytic compounds. We conclude that this method can be used as a simple and fast senescence assay independently of the origin of the cells and the procedure to induce senescence.</p></div>
    </section>
