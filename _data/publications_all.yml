- abstract:
  - label: ''
    text: Prediabetes, characterized by impaired fasting glucose and/or glucose tolerance,
      is associated with organ damage, increased mortality, and accelerated aging,
      even before diabetes onset. Severe short-term energy restriction while maintaining
      essential nutrient intake is among the most effective strategies for weight
      loss, metabolic health improvement, and delaying type 2 diabetes progression.
      Extracellular vesicles contribute to these metabolic benefits; however, the
      impact of energy-restriction-induced weight loss on the extracellular vesicle
      proteome remains incompletely understood. This study employed targeted and untargeted
      proteomics to investigate the effect of an 8-week severely energy-restricted
      diet on the plasma proteome in adults with prediabetes from Sydney, Australia,
      as part of the PREVIEW study. Circulating extracellular vesicles were enriched
      in plasma using an immunoaffinity-based protocol. A total of 44 participants
      who achieved at least a 12% weight loss and provided informed consent were included
      in the study. Paired changes in over 2000 proteins between baseline and week
      8 were analyzed. Following the intervention, multiple proteins associated with
      inflammation and senescence were significantly reduced, reversing the increase
      commonly associated with aging. The decline in inflammatory and senescence markers
      may have been mediated by extracellular vesicles, as indicated by significantly
      lower circulating levels of several vesicular markers. Additionally, several
      markers of protein synthesis downstream of mTORC1 and protein degradation were
      significantly reduced in vesicle-enriched plasma, suggesting decreased intercellular
      secretion and/or trafficking. Overall, this study identifies a diet-induced
      proteomic signature suggestive of reduced inflammation, lower senescence, and
      enhanced vesicle-associated proteostasis, potentially conferring health benefits
      beyond glycemic control.
