- abstract:
  - label: ''
    text: Exposure to the herbicide paraquat (PQ) is associated with an increased
      risk of idiopathic Parkinson's disease (PD). Therapies based on PQ's presumed
      mechanisms of action have not, however, yielded effective disease therapies.
      Cellular senescence is an anticancer mechanism that arrests proliferation of
      replication-competent cells and results in a pro-inflammatory senescence-associated
      secretory phenotype (SASP) capable of damaging neighboring tissues. Here, we
      demonstrate that senescent cell markers are preferentially present within astrocytes
      in PD brain tissues. Additionally, PQ was found to induce astrocytic senescence
      and an SASP in vitro and in vivo, and senescent cell depletion in the latter
      protects against PQ-induced neuropathology. Our data suggest that exposure to
      certain environmental toxins promotes accumulation of senescent cells in the
      aging brain, which can contribute to dopaminergic neurodegeneration. Therapies
      that target senescent cells may constitute a strategy for treatment of sporadic
      PD, for which environmental exposure is a major risk factor.
