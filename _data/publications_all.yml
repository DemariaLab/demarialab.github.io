- abstract:
  - label: ''
    text: Cellular senescence is a stress-response mechanism implicated in various
      physiological processes, diseases, and aging. Current detection approaches have
      partially addressed the issue of senescent cell identification in clinical specimens.
      Effective methodologies enabling precise isolation or live tracking of senescent
      cells are still lacking. In-depth analysis of truly senescent cells is, therefore,
      an extremely challenging task. We report (1) the synthesis and validation of
      a fluorophore-conjugated, Sudan Black-B analog (GLF16), suitable for in vivo
      and in vitro analysis of senescence by fluorescence microscopy and flow cytometry
      and (2) the development and application of a GLF16-carrying micelle vector facilitating
      GLF16 uptake by living senescent cells in vivo and in vitro. The compound and
      the applied methodology render isolation of senescent cells an easy, rapid,
      and precise process. Straightforward nanocarrier-mediated GLF16 delivery in
      live senescent cells comprises a unique tool for characterization of senescence
      at an unprecedented depth.
