- abstract:
  - label: ''
    text: 'Italy currently ranks among the world''s oldest nations, with adults aged
      ≥65 years accounting for 24.1% of the population - the highest proportion in
      the EU - and a projected median age of 51 years by 2050. While life expectancy
      at birth reaches 85.4 years for women and 81.4 for men, Healthy Life Years amount
      to only 69.6 and 68.5, respectively, documenting a substantial lifespan-healthspan
      divide. The prevalence of multimorbidity and disability exceeds 60% in adults
      aged ≥75 years; women bear a disproportionate share of this burden, both as
      patients and as caregivers. Meanwhile, the Italian National Health Service (Servizio
      Sanitario Nazionale, SSN) remains hospital-centric, regionally fragmented, and
      predominantly reactive, with prevention accounting for a historically modest
      share of total expenditure. Against this background, longevity medicine is an
      emerging, prevention-oriented discipline that aims to extend healthspan - defined
      here as the portion of life lived in good health, with preserved physical and
      cognitive function and without significant disability or multimorbidity. It
      integrates multi-omic biomarkers, digital monitoring, adaptive trial methodology,
      and life-course risk stratification within a translational framework. Although
      most constituent tools remain at an exploratory or surrogate stage, and clinical
      utility has yet to be established, the emphasis on early intervention and precision
      prevention offers potential to reduce the accumulation of age-related disease
      and ease long-term pressure on the SSN. This position paper analyzes Italy''s
      demographic and epidemiological trajectory, examines the structural constraints
      of the SSN, and outlines the scientific foundations of longevity medicine. It
      advocates for multidisciplinary translational research and identifies five strategic
      investment priorities: (i) clinically validated biomarkers of biological age;
      (ii) interoperable digital monitoring platforms; (iii) Bayesian adaptive multimodal
      trials; (iv) explainable-AI risk stratification tools; and (v) longevity-informed
      curricula in medical training. These proposals should be regarded as a staged
      agenda for evaluation; their relevance will depend on whether they deliver measurable
      gains in patient-relevant outcomes, feasibility, and cost-effectiveness within
      the SSN.'
