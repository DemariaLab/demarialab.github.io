- abstract:
  - label: ''
    text: The human lifespan is influenced by various factors, with physical activity
      being a significant contributor. Despite the clear benefit of exercise on health
      and longevity, the association between different types of sports and lifespan
      is yet to be considered. Accordingly, we aimed to study this association in
      a large international cohort of former athletes using a robust linear regression
      model. We collected data on athletes from public sources, accumulating a total
      of 95,210 observations, 95.5% of which were accounted for by males. The dataset
      represented athletes born between 1862 and 2002 from 183 countries across 44
      sports disciplines. We calculated the change in lifespan by measuring the difference
      in age between athletes and the corresponding reference populations, while accounting
      for variations caused by sex, year of death, and country. The results revealed
      that various sports impacted lifespan differently, with male athletes being
      more likely to experience benefits from sports than female athletes. Among male
      athletes, pole vaulting and gymnastics were linked to the highest extension
      in lifespan (8.4 years, 95% CI [6.8, 9.9] and 8.2 years, 95% CI [7.4, 9], respectively),
      while volleyball and sumo wrestling were the most negatively associated with
      lifespan (- 5.4 years, 95% CI [- 7, - 3.8]; - 9.8 years, 95% CI [- 11, - 8.6],
      respectively). The association between lifespan and popular team sports in males
      was positive for cricket, rowing, baseball, water polo, Australian rules, hurling,
      lacrosse, field hockey, minimal for rugby, canoeing and kayaking, basketball,
      gridiron football, and football (soccer), and negative for handball and volleyball.
      Racquet sports (i.e., tennis and badminton) exhibited a consistent and positive
      association in both male and female athletes, as shown by an extended lifespan
      of up to 5.7 years in males (95% CI [5, 6.5]) and 2.8 years in females (95%
      CI [1.8, 3.9]). Although lacking conclusive evidence, we theorize that the observed
      results may be attributed to the aerobic and anaerobic characteristics of each
      sport, with mixed sports yielding the maximum benefits for the lifespan. While
      results from female athletes should be cautiously interpreted, our study highlights
      the complex interplay between sports and lifespan and contributes to the growing
      body of knowledge on the multifaceted relationship between physical activity
      and human longevity.
