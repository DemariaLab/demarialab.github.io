- abstract:
  - label: ''
    text: Cellular senescence is a stress or damage response that causes a permanent
      proliferative arrest and secretion of numerous factors with potent biological
      activities. This senescence-associated secretory phenotype (SASP) has been characterized
      largely for secreted proteins that participate in embryogenesis, wound healing,
      inflammation, and many age-related pathologies. By contrast, lipid components
      of the SASP are understudied. We show that senescent cells activate the biosynthesis
      of several oxylipins that promote segments of the SASP and reinforce the proliferative
      arrest. Notably, senescent cells synthesize and accumulate an unstudied intracellular
      prostaglandin, 1a,1b-dihomo-15-deoxy-delta-12,14-prostaglandin J2. Released
      15-deoxy-delta-12,14-prostaglandin J2 is a biomarker of senolysis in culture
      and in vivo. This and other prostaglandin D2-related lipids promote the senescence
      arrest and SASP by activating RAS signaling. These data identify an important
      aspect of cellular senescence and a method to detect senolysis.
