- abstract:
  - label: ''
    text: Cellular senescence is a state of permanent cell cycle arrest activated
      in response to different damaging stimuli. Activation of cellular senescence
      is a hallmark of various pathophysiological conditions including tumor suppression,
      tissue remodeling and aging. The inducers of cellular senescence in vivo are
      still poorly characterized. However, a number of stimuli can be used to promote
      cellular senescence ex vivo. Among them, most common senescence-inducers are
      replicative exhaustion, ionizing and non-ionizing radiation, genotoxic drugs,
      oxidative stress, and demethylating and acetylating agents. Here, we will provide
      detailed instructions on how to use these stimuli to induce fibroblasts into
      senescence. This protocol can easily be adapted for different types of primary
      cells and cell lines, including cancer cells. We also describe different methods
      for the validation of senescence induction. In particular, we focus on measuring
      the activity of the lysosomal enzyme Senescence-Associated β-galactosidase (SA-β-gal),
      the rate of DNA synthesis using 5-ethynyl-2'-deoxyuridine (EdU) incorporation
      assay, the levels of expression of the cell cycle inhibitors p16 and p21, and
      the expression and secretion of members of the Senescence-Associated Secretory
      Phenotype (SASP). Finally, we provide example results and discuss further applications
      of these protocols.
