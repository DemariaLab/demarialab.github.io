- abstract:
  - label: ''
    text: Chronic exposure to UVR is known to disrupt tissue homeostasis, accelerate
      the onset of age-related phenotypes, and increase the risk for skin cancer-a
      phenomenon defined as photoaging. In this paper, we review the current knowledge
      on how UV exposure causes cells to prematurely enter cellular senescence. We
      describe the mechanisms contributing to the accumulation of senescent cells
      in the skin and how the persistence of cellular senescence can promote impaired
      regenerative capacity, chronic inflammation, and tumorigenesis associated with
      photoaging. We conclude by highlighting the potential of senolytic drugs in
      delaying the onset and progression of age-associated phenotypes in the skin.
