      using a transgenic approach delays several age-associated disorders, suggesting
      that SCs play a causative role in certain age-related pathologies. Thus, a 'senolytic'
      pharmacological agent that can selectively kill SCs holds promise for rejuvenating
      tissue stem cells and extending health span. To test this idea, we screened
      a collection of compounds and identified ABT263 (a specific inhibitor of the
      anti-apoptotic proteins BCL-2 and BCL-xL) as a potent senolytic drug. We show
      that ABT263 selectively kills SCs in culture in a cell type- and species-independent
      manner by inducing apoptosis. Oral administration of ABT263 to either sublethally
      irradiated or normally aged mice effectively depleted SCs, including senescent
      bone marrow hematopoietic stem cells (HSCs) and senescent muscle stem cells
      (MuSCs). Notably, this depletion mitigated TBI-induced premature aging of the
      hematopoietic system and rejuvenated the aged HSCs and MuSCs in normally aged
      mice. Our results demonstrate that selective clearance of SCs by a pharmacological
      agent is beneficial in part through its rejuvenation of aged tissue stem cells.
      Thus, senolytic drugs may represent a new class of radiation mitigators and
      anti-aging agents.
