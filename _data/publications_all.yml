- abstract:
  - label: BACKGROUND AND PURPOSE
    text: Although radiotherapy is essential for treating brain tumors, it often damages
      surrounding healthy brain tissue, causing long-term neurocognitive dysfunction.
      Cellular senescence, a stable state of cell cycle arrest triggered by various
      stressors including radiation-induced DNA damage, has been implicated in aging-
      and neurodegeneration-associated cognitive decline via its pro-inflammatory
      secretome and has been reported to exert paracrine effects on distant organs.
      However, whether brain irradiation, particularly through the induction of cellular
      senescence, can trigger changes in peripheral tissues remains largely unknown.
  - label: MATERIALS AND METHODS
    text: Adult male rats received 14 Gy X-ray irradiation to the brain. Senescence-associated
      markers were assessed in the brain at 6 and 12 weeks post-irradiation and in
      peripheral tissues, including the kidney, small intestine, skeletal muscle,
      and liver, at 17 weeks post-irradiation. Liver samples were further examined
      for proliferation and fibrosis markers, as well as for liver enzyme activity.
      The senolytic ABT263 was administered to eliminate senescent cells.
  - label: RESULTS
    text: Brain irradiation induced senescence-like features in the brain but did
      not trigger p21-dependent senescence in the tested peripheral tissues. However,
      brain-irradiated rats exhibited increased proliferation, elevated GFAP levels,
      and enhanced ALT and AST activity in the liver. These hepatic changes were likely
      independent of cellular senescence, as they were not reversed by treatment with
      ABT263.
  - label: CONCLUSION
    text: Brain irradiation induces liver proliferation, increased GFAP levels, and
      altered ALT and AST activity, via mechanisms likely independent of senescence.
      Future investigation of blood GFAP levels is needed to determine whether the
      enhanced hepatic GFAP levels originate from the brain.
