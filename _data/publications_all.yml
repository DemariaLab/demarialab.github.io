- abstract:
  - label: ''
    text: Dysregulated epidermal growth factor receptor (EGFR) is an oncogenic driver
      of many human cancers, promoting aberrant cell proliferation, migration, and
      survival. Pharmacological targeting of EGFR is often challenged by acquired
      mechanisms of resistance. Ligand-dependent mechanisms in EGFR wild-type cells
      rely on ligand or receptor overexpression, allowing cells to outcompete inhibitors
      and perpetuate signaling in an autocrine manner. Importantly, EGFR ligands are
      synthesized as membrane-bound precursors that must be solubilized to enable
      receptor-ligand interactions. The A disintegrin and metalloproteinase 17 (ADAM17)
      is considered the main sheddase of several EGFR ligands, and a potential pharmacological
      target. However, its broad substrate range and ubiquitous expression complicate
      its therapeutic targeting. Here, we present a novel bispecific fusion protein
      construct consisting of the inhibitory prodomain of ADAM17 (TPD), fused to an
      EGFR-targeting designed ankyrin repeat protein (DARPin). TPD is a natural inhibitor
      of ADAM17, maintaining the protease in a zymogen-like form. Meanwhile, the high
      affinity anti-EGFR DARPin E01 binds to EGFR and inhibits ligand binding. The
      resulting fusion protein E01-GS-TPD retained binding ability to both molecular
      targets EGFR and ADAM17. The large difference in affinity for each target resulted
      in enrichment of the fusion protein in EGFR-positive cells compared to EGFR-negative
      cells, suggesting a possible application in autocrine signaling inhibition.
      Accordingly, E01-GS-TPD decreased migration and proliferation of EGFR-dependent
      cell lines with no significant increase in apoptotic cell death. Finally, inhibition
      of proliferation was observed through EGFR ligand-dependent mechanisms as growth
      inhibition was not observed in EGFR mutant or KRAS mutant cell lines. The use
      of bispecific proteins targeting the EGFR/ADAM17 axis could be an innovative
      strategy for the treatment of EGFR-dependent cancers.
