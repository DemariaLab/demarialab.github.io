- abstract:
  - label: ''
    text: Regular endurance exercise training is an effective intervention for the
      maintenance of metabolic health and the prevention of many age-associated chronic
      diseases. Several metabolic and inflammatory factors are involved in the health-promoting
      effects of exercise training, but regulatory mechanisms remain poorly understood.
      Cellular senescence-a state of irreversible growth arrest-is considered a basic
      mechanism of aging. Senescent cells accumulate over time and promote a variety
      of age-related pathologies from neurodegenerative disorders to cancer. Whether
      long-term intensive exercise training affect the accumulation of age-associated
      cellular senescence is still unclear. Here, we show that the classical senescence
      markers p16 and IL-6 were markedly higher in the colon mucosa of middle-aged
      and older overweight adults than in young sedentary individuals, but this upregulation
      was significantly blunted in age-matched endurance runners. Interestingly, we
      observe a linear correlation between the level of p16 and the triglycerides
      to HDL ratio, a marker of colon adenoma risk and cardiometabolic dysfunction.
      Our data suggest that chronic high-volume high-intensity endurance exercise
      can play a role in preventing the accumulation of senescent cells in cancer-prone
      tissues like colon mucosa with age. Future studies are warranted to elucidate
      if other tissues are also affected, and what are the molecular and cellular
      mechanisms that mediate the senopreventative effects of different forms of exercise
      training.
