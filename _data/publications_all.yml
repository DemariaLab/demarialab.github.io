- abstract:
  - label: ''
    text: Cellular senescence is a state of irreversible growth arrest characterized
      by hypertrophy and secretion of various bioactive molecules, a phenomenon defined
      the Senescence-Associated Secretory Phenotype (SASP). Senescent cells are implicated
      in a number of biological functions, from embryogenesis to aging. Significantly,
      excessive accumulation of senescent cells is associated to a decline of regenerative
      capacity and chronic inflammation. In accordance, the removal of senescent cells
      is sufficient to delay several pathologies and promote healthspan. Calorie restriction
      (CR) without malnutrition is currently the most effective non-genetic intervention
      to delay aging phenotypes. Recently, we have shown that CR can prevent accumulation
      of senescent cells in both mice and humans. Here, we summarize the current knowledge
      on the molecular and cellular events associated with CR, and define how these
      events can interfere with the induction of cellular senescence. We discuss the
      potential side effects of preventing senescence, and the possible alternative
      dietary interventions with potential senolytic properties.
