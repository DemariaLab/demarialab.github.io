- abstract:
  - label: ''
    text: Aging of the hematopoietic system impairs hematopoietic stem cell (HSC)
      function and alters bone marrow niche behavior, increasing susceptibility to
      anemia, infections, and hematologic malignancies. Here, pharmacologic clearance
      of senescent cells with the PROTAC compound 753b simultaneously targeting BCL-xL
      and BCL-2 reverses key secretory, transcriptional, and functional hallmarks
      of hematopoietic aging with low toxicity, restoring balanced lineage output.
      Single-cell RNA sequencing further demonstrates that 753b treatment attenuates
      aging-associated transcriptional signatures in HSCs, while selectively eliminating
      senescent, pro-survival niche cells without grossly perturbing niche composition.
      Functionally, 753b suppresses pro-inflammatory cues from both niche and hematopoietic
      cells including those emanating from neutrophil progenitors, rebalancing global
      bone marrow secretory ecosystem across stromal and hematopoietic compartments.
      Collectively, we identify 753b-induced senescent cell clearance as a powerful
      strategy to rejuvenate aged hematopoiesis and re-establish homeostatic communication
      between HSCs and their microenvironment, with implications for mitigating age-related
      hematologic dysfunction and improving hematologic health in older individuals.
