- abstract:
  - label: ''
    text: Several cancer interventions induce DNA damage and promote senescence in
      cancer and nonmalignant cells. Senescent cells secrete a collection of proinflammatory
      factors collectively termed the senescence-associated secretory phenotype (SASP).
      SASP factors are able to potentiate various aspects of tumorigenesis, including
      proliferation, metastasis, and immunosuppression. Moreover, the accumulation
      and persistence of therapy-induced senescent cells can promote tissue dysfunction
      and the early onset of various age-related symptoms in treated cancer patients.
      Here, we review in detail the mechanisms by which cellular senescence contributes
      to cancer development and the side effects of cancer therapies. We also review
      how pharmacological interventions to eliminate senescent cells or inhibit SASP
      production can mitigate these negative effects and propose therapeutic strategies
      based on the age of the patient.
