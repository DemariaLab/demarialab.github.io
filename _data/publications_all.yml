- abstract:
  - label: BACKGROUND
    text: Cellular senescence is a fundamental mechanism of ageing, characterised
      by stable cell cycle arrest and the acquisition of a pro-inflammatory secretory
      phenotype. Nutritional interventions are widely proposed to modulate ageing
      biology, but their effects on cellular senescence in humans remain unclear.
      We systematically synthesised evidence from interventional human studies assessing
      the impact of nutritional strategies on biomarkers of cellular senescence.
  - label: METHODS
    text: We searched MEDLINE, Embase, Cochrane Library, and Web of Science from inception
      to September 10, 2024. We included interventional studies in humans reporting
      biomarkers of cellular senescence, including markers of cell cycle arrest, DNA
      damage, telomere length, transcriptomic signatures, and factors of the senescence-associated
      secretory phenotype (SASP).
  - label: RESULTS
    text: Twenty-nine articles (27 trials; 3811 participants) were included. Across
      studies, nutritional interventions modulated multiple senescence biomarkers
      to varying extents, with calorie restriction producing the most recurrent reductions
      in circulating inflammatory and secretory factors commonly included in SASP
      panels as well as senescence-associated transcriptomic signatures. Classical
      markers of cell cycle arrest (e.g., CDKN2A/p16, CDKN1A/p21) and telomere length
      were largely unchanged or highly variable. Calorie restriction mimetics, particularly
      metformin and rapamycin, showed context-dependent effects, most evident under
      conditions of metabolic or physiological stress. Among dietary supplements,
      n-3 polyunsaturated fatty acids may modulate selected inflammatory/SASP-related
      circulating markers, although the evidence for dietary supplements remains limited
      and heterogeneous.
  - label: CONCLUSIONS
    text: In humans, available evidence suggests that nutritional interventions may
      preferentially affect senescence-associated inflammatory and secretory biomarker
      profiles, particularly SASP-related mediators, rather than markers more directly
      related to senescent cell abundance. However, because SASP factors and circulating
      cytokines are heterogeneous and not specific to senescent cells, these findings
      should be interpreted as evidence for possible modulation of senescence-associated
      markers rather than definitive effects on senescence burden. These observations
      support the use of multi-marker and functionally relevant endpoints in future
      clinical studies targeting biological ageing and cellular senescence.
