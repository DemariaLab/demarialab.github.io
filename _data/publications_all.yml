- abstract:
  - label: ''
    text: The TOR (target of rapamycin) kinase limits longevity by poorly understood
      mechanisms. Rapamycin suppresses the mammalian TORC1 complex, which regulates
      translation, and extends lifespan in diverse species, including mice. We show
      that rapamycin selectively blunts the pro-inflammatory phenotype of senescent
      cells. Cellular senescence suppresses cancer by preventing cell proliferation.
      However, as senescent cells accumulate with age, the senescence-associated secretory
      phenotype (SASP) can disrupt tissues and contribute to age-related pathologies,
      including cancer. MTOR inhibition suppressed the secretion of inflammatory cytokines
      by senescent cells. Rapamycin reduced IL6 and other cytokine mRNA levels, but
      selectively suppressed translation of the membrane-bound cytokine IL1A. Reduced
      IL1A diminished NF-κB transcriptional activity, which controls much of the SASP;
      exogenous IL1A restored IL6 secretion to rapamycin-treated cells. Importantly,
      rapamycin suppressed the ability of senescent fibroblasts to stimulate prostate
      tumour growth in mice. Thus, rapamycin might ameliorate age-related pathologies,
      including late-life cancer, by suppressing senescence-associated inflammation.
