- abstract:
  - label: ''
    text: Cancer is a devastating disease that increases exponentially with age. Cancer
      arises from cells that proliferate in an unregulated manner, an attribute that
      is countered by cellular senescence. Cellular senescence is a potent tumor-suppressive
      process that halts the proliferation, essentially irreversibly, of cells at
      risk for malignant transformation. A number of anti-cancer drugs have emerged
      that induce tumor cells to undergo cellular senescence. However, although a
      senescence response can halt the proliferation of cancer cells, the presence
      of senescent cells in tissues has been associated with age-related diseases,
      including, ironically, late-life cancer. Thus, anti-cancer therapies that can
      induce senescence might also drive aging phenotypes and age-related pathology.
      The deleterious effects of senescent cells most likely derive from their senescence-associated
      secretory phenotype or SASP. The SASP entails the secretion of numerous inflammatory
      cytokines, growth factors and proteases that can render the tissue microenvironment
      favorable for tumor growth. Here, we discuss the beneficial and detrimental
      effects of inducing cellular senescence, and propose strategies for targeting
      senescent cells as a means to fight cancer.
