- abstract:
  - label: ''
    text: Senescent cells (SnCs) accumulate in many vertebrate tissues with age and
      contribute to age-related pathologies, presumably through their secretion of
      factors contributing to the senescence-associated secretory phenotype (SASP).
      Removal of SnCs delays several pathologies and increases healthy lifespan. Aging
      and trauma are risk factors for the development of osteoarthritis (OA), a chronic
      disease characterized by degeneration of articular cartilage leading to pain
      and physical disability. Senescent chondrocytes are found in cartilage tissue
      isolated from patients undergoing joint replacement surgery, yet their role
      in disease pathogenesis is unknown. To test the idea that SnCs might play a
      causative role in OA, we used the p16-3MR transgenic mouse, which harbors a
      p16INK4a (Cdkn2a) promoter driving the expression of a fusion protein containing
      synthetic Renilla luciferase and monomeric red fluorescent protein domains,
      as well as a truncated form of herpes simplex virus 1 thymidine kinase (HSV-TK).
      This mouse strain allowed us to selectively follow and remove SnCs after anterior
      cruciate ligament transection (ACLT). We found that SnCs accumulated in the
      articular cartilage and synovium after ACLT, and selective elimination of these
      cells attenuated the development of post-traumatic OA, reduced pain and increased
      cartilage development. Intra-articular injection of a senolytic molecule that
      selectively killed SnCs validated these results in transgenic, non-transgenic
      and aged mice. Selective removal of the SnCs from in vitro cultures of chondrocytes
      isolated from patients with OA undergoing total knee replacement decreased expression
      of senescent and inflammatory markers while also increasing expression of cartilage
      tissue extracellular matrix proteins. Collectively, these findings support the
      use of SnCs as a therapeutic target for treating degenerative joint disease.
