- abstract:
  - label: ''
    text: Studies in flies, mice, and human models have provided a conceptual framework
      for how paracrine interactions between damaged cells and the surrounding tissue
      control tissue repair. These studies have amassed evidence for an evolutionarily
      conserved secretory program that regulates tissue homeostasis. This program
      coordinates cell survival and proliferation during tissue regeneration and repair
      in young animals. By virtue of chronic engagement, however, it also contributes
      to the age-related decline of tissue homeostasis leading to degeneration, metabolic
      dysfunction, and cancer. Here, we review recent studies that shed light on the
      nature and regulation of this evolutionarily conserved secretory program.
