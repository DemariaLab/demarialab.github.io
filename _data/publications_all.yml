- abstract:
  - label: ''
    text: Excessive amounts of reactive oxygen species (ROS) lead to macromolecular
      damage and high levels of cell death with consequent pathological sequelae.
      We hypothesized that switching cell death to a tissue regenerative state could
      potentially improve the short-term and long-term detrimental effects of ROS-associated
      acute tissue injury, although the mechanisms regulating oxidative stress-induced
      cell fate decisions and their manipulation for improving repair are poorly understood.
      Here, we show that cells exposed to high oxidative stress enter a poly (ADP-ribose)
      polymerase 1 (PARP1)-mediated regulated cell death, and that blocking PARP1
      activation promotes conversion of cell death into senescence (CODIS). We demonstrate
      that this conversion depends on reducing mitochondrial Ca2+ overload as a consequence
      of retaining the hexokinase II on mitochondria. In a mouse model of kidney ischemia-reperfusion
      damage, PARP inhibition reduces necrosis and increases transient senescence
      at the injury site, alongside improved recovery from damage. Together, these
      data provide evidence that converting cell death into transient senescence can
      therapeutically benefit tissue regeneration.
