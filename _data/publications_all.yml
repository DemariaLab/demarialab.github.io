- abstract:
  - label: ''
    text: STAT3 mediates cytokine and growth factor receptor signalling, becoming
      transcriptionally active upon tyrosine 705 phosphorylation (Y-P). Constitutively
      Y-P STAT3 is observed in many tumors that become addicted to its activity, and
      STAT3 transcriptional activation is required for tumor transformation downstream
      of several oncogenes. We have recently demonstrated that constitutively active
      STAT3 drives a metabolic switch towards aerobic glycolysis through the transcriptional
      induction of Hif-1α and the down-regulation of mitochondrial activity, in both
      MEF cells expressing constitutively active STAT3 (Stat3C/C) and STAT3-addicted
      tumor cells. This novel metabolic function is likely involved in mediating pre-oncogenic
      features in the primary Stat3C/C MEFs such as resistance to apoptosis and senescence
      and rapid proliferation. Moreover, it strongly contributes to the ability of
      primary Stat3C/C MEFs to undergo malignant transformation upon spontaneous immortalization,
      a feature that may explain the well known causative link between STAT3 constitutive
      activity and tumor transformation under chronic inflammatory conditions. Taken
      together with the recently uncovered role of STAT3 in regulating energy metabolism
      from within the mitochondrion when phosphorylated on Ser 727, these data place
      STAT3 at the center of a hub regulating energy metabolism under different conditions,
      in most cases promoting cell survival, proliferation and malignant transformation
      even though with distinct mechanisms.
