- abstract:
  - label: ''
    text: Human and mouse skin accumulate senescent cells in both the epidermis and
      dermis during aging. When chronically present, senescent cells are thought to
      enhance the age-dependent deterioration of the skin during extrinsic and intrinsic
      aging. However, when transiently present, senescent cells promote optimal wound
      healing. Here, we review recent studies on how senescent cells and the senescence-associated
      secretory phenotype contribute to different physiological and pathophysiological
      conditions in the skin with a focus on some of the cell autonomous and non-autonomous
      functions of senescent cells in the context of skin aging and wound healing.
