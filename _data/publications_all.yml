- abstract:
  - label: UNLABELLED
    text: 'Abstract Background: The pro-oncogenic transcription factor STAT3 is constitutively
      active in tumours of many different origins, which often become addicted to
      its activity. STAT3 is believed to contribute to the initial survival of pre-cancerous
      cells as well as to hyper-proliferation and, later, metastasis.'
  - label: MATERIALS AND METHODS
    text: To evaluate the contribution of enhanced STAT3 activation in a controlled
      model system, we generated knock-in mice in which a mutant constitutively active
      Stat3C allele replaces the endogenous wild-type allele and analysed its contribution
      to breast tumorigenesis. Moreover, we generated Stat3C/C MEF cells and analysed
      their gene expression and metabolic profiles.
  - label: RESULTS
    text: Constitutively active STAT3 could enhance the tumorigenic power of the rat
      Neu oncogene in MMTV-Neu transgenic mice and trigger the production of earlier
      onset and more invasive mammary tumours. Tumour-derived cell lines displayed
      higher migrating, invading and metastatic ability and showed disrupted distribution
      of cell-cell junction markers. These features were mediated by STAT3-dependent
      over-expression of the C-terminal tensin-like (Cten) focal adhesion protein.
      Moreover, STAT3C alone was able to induce aerobic glycolysis and down-regulate
      mitochondrial activity, both in primary fibroblasts and in STAT3-dependent tumour
      cell lines, acting via both HIF-1α-dependent and independent mechanisms.
  - label: CONCLUSIONS
    text: STAT3 can induce a metabolic switch that predisposes cells to aberrant survival,
      enhanced proliferation and, finally, tumour transformation. Later, enhanced
      Cten expression contributes to tissue infiltration and metastasis. While not
      excluding the contribution of many other tumour-specific STAT3 target genes,
      our data provide a unifying explanation of several pro-oncogenic STAT3 activities.
