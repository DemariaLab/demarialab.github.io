- abstract:
  - label: ''
    text: Aging is emerging as a druggable target with growing interest from academia,
      industry and investors. New technologies such as artificial intelligence and
      advanced screening techniques, as well as a strong influence from the industry
      sector may lead to novel discoveries to treat age-related diseases. The present
      review summarizes presentations from the 7th Annual Aging Research and Drug
      Discovery (ARDD) meeting, held online on the 1st to 4th of September 2020. The
      meeting covered topics related to new methodologies to study aging, knowledge
      about basic mechanisms of longevity, latest interventional strategies to target
      the aging process as well as discussions about the impact of aging research
      on society and economy. More than 2000 participants and 65 speakers joined the
      meeting and we already look forward to an even larger meeting next year. Please
      mark your calendars for the 8th ARDD meeting that is scheduled for the 31st
      of August to 3rd of September, 2021, at Columbia University, USA.
