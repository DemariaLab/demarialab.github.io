- abstract:
  - label: ''
    text: Cellular senescence is a state of stable cell cycle arrest arising in response
      to DNA and mitochondrial damages. Senescent cells undergo morphological, structural
      and functional changes that are influenced by a number of variables, including
      time, stress, tissue, and cell type. The heterogeneity of the senescent phenotype
      is exemplified by the many biological properties that senescent cells can cover.
      The advent of innovative model organisms has demonstrated a functional role
      of senescent cells during embryogenesis, tissue remodeling, tumorigenesis and
      aging. Importantly, prolonged and aberrant persistence of senescent cells is
      often associated with tissue dysfunction and pathology, and is partially the
      consequence of mechanisms that enhance survival and resistance to cell death.
      Here, we describe the main molecular players involved in promoting survival
      of senescent cells, with particular emphasis on the regulation of senescence-associated
      anti-apoptotic pathways. We discuss the consequences these pathways have in
      providing resistance to intrinsic and extrinsic pro-apoptotic signals. Finally,
      we highlight the importance of these pathways in the development of targets
      for senolytic interventions.
