- abstract:
  - label: ''
    text: Cellular senescence is a potent tumor-suppressive mechanism that arrests
      cell proliferation and has been linked to aging. However, studies of senescence
      have been impeded by the lack of simple, exclusive biomarkers of the senescent
      state. Senescent cells develop characteristic morphological changes, which include
      enlarged and often irregular nuclei and chromatin reorganization. Because alterations
      to the nuclear lamina can affect both nuclear morphology and gene expression,
      we examined the nuclear lamina of senescent cells. We show here than lamin B1
      is lost from primary human and murine cell strains when they are induced to
      senesce by DNA damage, replicative exhaustion, or oncogene expression. Lamin
      B1 loss did not depend on the p38 mitogen-activated protein kinase, nuclear
      factor-κB, ataxia telangiectasia-mutated kinase, or reactive oxygen species
      signaling pathways, which are positive regulators of senescent phenotypes. However,
      activation of either the p53 or pRB tumor suppressor pathway was sufficient
      to induce lamin B1 loss. Lamin B1 declined at the mRNA level via a decrease
      in mRNA stability rather than by the caspase-mediated degradation seen during
      apoptosis. Last, lamin B1 protein and mRNA declined in mouse tissue after senescence
      was induced by irradiation. Our findings suggest that lamin B1 loss can serve
      as biomarker of senescence both in culture and in vivo.
