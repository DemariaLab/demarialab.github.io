- abstract:
  - label: ''
    text: The development of genetic tools allowed for the validation of the pro-aging
      and pro-disease functions of senescent cells in vivo. These discoveries prompted
      the development of senotherapies-pharmaceutical interventions aimed at interfering
      with the detrimental effect of senescent cells-that are now entering the clinical
      stage. However, unequivocal identification and examination of cellular senescence
      remains highly difficult because of the lack of universal and specific markers.
      Here, to overcome the limitation of measuring individual markers, we describe
      a detailed two-phase algorithmic assessment to quantify various senescence-associated
      parameters in the same specimen. In the first phase, we combine the measurement
      of lysosomal and proliferative features with the expression of general senescence-associated
      genes to validate the presence of senescent cells. In the second phase we measure
      the levels of pro-inflammatory markers for specification of the type of senescence.
      The protocol can help graduate-level basic scientists to improve the characterization
      of senescence-associated phenotypes and the identification of specific senescent
      subtypes. Moreover, it can serve as an important tool for the clinical validation
      of the role of senescent cells and the effectiveness of anti-senescence therapies.
