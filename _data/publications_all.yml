- abstract:
  - label: ''
    text: Organismal aging is a multifactorial process characterized by the onset
      of degenerative conditions and cancer. One of the key drivers of aging is cellular
      senescence, a state of irreversible growth arrest induced by many pro-tumorigenic
      stresses. Senescent cells accumulate late in life and at sites of age-related
      pathologies, where they contribute to disease onset and progression through
      complex cell and non-cell autonomous effects. Here, we summarize the mechanisms
      by which cellular senescence can promote aging, and we offer an extensive description
      of current potential pharmacological interventions for senescent cells, highlighting
      limitations and suggesting alternatives.
