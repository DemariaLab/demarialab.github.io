- abstract:
  - label: ''
    text: Calcium ion (Ca²⁺) dysregulation contributes to both noise-induced (NIHL)
      and age-related hearing loss (ARHL). Voltage-gated Ca²⁺ channels (VGCCs) regulate
      Ca²⁺ influx and are, therefore, candidate therapeutic targets for acquired hearing
      loss. The T-type channel CaV3.2 (CACNA1H) has been proposed to influence cochlear
      function and vulnerability. Here, we characterized the distribution and age-dependent
      expression of Cacna1h in the mouse cochlea, and tested whether CaV3.2 modulation
      could mitigate NIHL or ARHL using genetic deletion and/or pharmacological blockade.
      Transcriptomic analyses of isolated cochlear sensorineural and metabolic substructures
      showed that Cacna1h expression remains stable from 6 weeks to 2 years of age.
      Auditory brainstem responses together with immunofluorescence and quantitative
      image analyses revealed elevated wave I thresholds and reduced amplitudes in
      6-week-old CaV3.2 knockout (KO) compared to wildtype (WT) and heterozygous (HET)
      mice, despite comparable inner hair cell (IHC), IHC afferent presynaptic ribbon,
      and outer hair cell (OHC) densities. After noise exposure, threshold shifts
      were similar across genotypes, with comparable hair cell and ribbon densities
      across the genotypes. At one year of age, CaV3.2 KO mice exhibited greater functional
      decline and OHC loss than WT and HET mice. Differences in cochlear function
      at 6 weeks were not explained by SGN subtype distribution or efferent terminal
      organization. In aged mice, mibefradil treatment reduced OHC loss but did not
      preserve cochlear function. These findings suggest that embryonic CaV3.2 deletion
      resulted in early baseline auditory deficits, consistent with their possible
      developmental requirement, and did not confer protection against noise-induced
      or age-related hearing loss.
