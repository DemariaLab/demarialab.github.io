- abstract:
  - label: ''
    text: 'Mechanistic target of rapamycin (mTOR) is a kinase found in a complex (mTORC1)
      that enables macromolecular synthesis and cell growth and is implicated in cancer
      etiology. The rapamycin-FK506 binding protein 12 (FKBP12) complex allosterically
      inhibits mTORC1. In response to stress, p53 inhibits mTORC1 through a separate
      pathway involving cell signaling and amino acid sensing. Thus, these different
      mechanisms could be additive. Here we show that p53 improved the ability of
      rapamycin to: 1) extend mouse life span, 2) suppress ionizing radiation (IR)-induced
      senescence-associated secretory phenotype (SASP) and 3) increase the levels
      of amino acids and citric acid in mouse embryonic stem (ES) cells. This additive
      effect could have implications for cancer treatment since rapamycin and p53
      are anti-oncogenic.'
