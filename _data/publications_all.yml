- abstract:
  - label: ''
    text: Cellular senescence is a cell fate triggered in response to stress and is
      characterized by stable cell-cycle arrest and a hypersecretory state. It has
      diverse biological roles, ranging from tissue repair to chronic disease. The
      development of new tools to study senescence in vivo has paved the way for uncovering
      its physiological and pathological roles and testing senescent cells as a therapeutic
      target. However, the lack of specific and broadly applicable markers makes it
      difficult to identify and characterize senescent cells in tissues and living
      organisms. To address this, we provide practical guidelines called "minimum
      information for cellular senescence experimentation in vivo" (MICSE). It presents
      an overview of senescence markers in rodent tissues, transgenic models, non-mammalian
      systems, human tissues, and tumors and their use in the identification and specification
      of senescent cells. These guidelines provide a uniform, state-of-the-art, and
      accessible toolset to improve our understanding of cellular senescence in vivo.
